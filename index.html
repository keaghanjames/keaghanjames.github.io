function pickRandom(arr, n) {
  return [...arr].sort(() => Math.random() - 0.5).slice(0, n);

/* ── Lazy image with fade-in ──────────────────────────────── */
function RealImg({ src, style, onClick, onMouseEnter, onMouseLeave }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (el.complete) {el.classList.add('loaded');return;}
    const handler = () => el.classList.add('loaded');
    el.addEventListener('load', handler);
    return () => el.removeEventListener('load', handler);
  }, [src]);
  return (
    <img ref={ref} src={src} className="photo-img" loading="lazy"
    onClick={onClick} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}
    style={{ width: '100%', height: 'auto', display: 'block', cursor: onClick ? 'pointer' : 'default', ...style }} />);

}

/* ── Lightbox ─────────────────────────────────────────────── */
function Lightbox({ photos, startIndex, onClose }) {
  const [idx, setIdx] = useState(startIndex);
  const touchStart = useRef(null);
  useEffect(() => {
    const h = (e) => {
      if (e.key === 'ArrowRight') setIdx((i) => (i + 1) % photos.length);
      if (e.key === 'ArrowLeft') setIdx((i) => (i - 1 + photos.length) % photos.length);
      if (e.key === 'Escape') onClose();
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [photos.length, onClose]);

  const onTouchStart = (e) => {
    const tt = e.touches[0];
    touchStart.current = { x: tt.clientX, y: tt.clientY, t: Date.now() };
  };
  const onTouchEnd = (e) => {
    const s = touchStart.current;
    if (!s) return;
    const tt = e.changedTouches[0];
    const dx = tt.clientX - s.x;
    const dy = tt.clientY - s.y;
    const dt = Date.now() - s.t;
    touchStart.current = null;
    // Horizontal swipe: > 50px, mostly horizontal, under 600ms
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 600) {
      if (dx < 0) setIdx((i) => (i + 1) % photos.length);
      else setIdx((i) => (i - 1 + photos.length) % photos.length);
    }
  };

  const [hovering, setHovering] = useState(false);
  const [isTouch, setIsTouch] = useState(false);
  useEffect(() => {
    if (typeof window !== 'undefined' && window.matchMedia) {
      setIsTouch(window.matchMedia('(hover: none)').matches);
    }
  }, []);
  const showArrows = hovering || isTouch;
  const btn = { position: 'absolute', top: '50%', transform: 'translateY(-50%)', background: 'rgba(0,0,0,0.45)', border: 'none', color: '#fff', width: 44, height: 44, borderRadius: 22, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background 0.15s, opacity 0.2s', zIndex: 10, opacity: showArrows ? 1 : 0, pointerEvents: showArrows ? 'auto' : 'none' };
  const p = photos[idx];

  return (
    <div onClick={onClose} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} style={{ position: 'fixed', inset: 0, zIndex: 1000, background: 'rgba(0,0,0,0.93)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', touchAction: 'pan-y' }}>
      <div onClick={(e) => e.stopPropagation()}
        onMouseEnter={() => setHovering(true)}
        onMouseLeave={() => setHovering(false)}
        style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center', maxWidth: '90vw', maxHeight: '82vh' }}>
        <img src={p.src} style={{ maxWidth: '90vw', maxHeight: '82vh', objectFit: 'contain', display: 'block', userSelect: 'none' }} />

/* ── Series page ──────────────────────────────────────────── */
function SeriesPage({ id, setPage, t, tweaks, resolvedSeries, updateSeriesOrder }) {
  const series = resolvedSeries.find((s) => s.id === id) || resolvedSeries[0];
  const [lightbox, setLightbox] = useState(null);
  const [copied, setCopied] = useState(false);
  const dragIdx = useRef(null);
  const hasPhotos = series.photos && series.photos.length > 0;
  const lbPhotos = hasPhotos ? series.photos.map((src) => ({ src })) : [];
  const placeholderHeights = [360, 240, 300, 200, 340, 220, 280, 190, 310, 230, 260, 200];

  const onDragStart = (i) => {dragIdx.current = i;};
  const onDrop = (i) => {
    if (dragIdx.current === null || dragIdx.current === i) return;
    const next = [...series.photos];
    const [moved] = next.splice(dragIdx.current, 1);
    next.splice(i, 0, moved);
    dragIdx.current = null;
    updateSeriesOrder(series.id, next);
  };
  const copyOrder = () => {
    const txt = series.photos.map((p) => p.split('/').pop()).join(', ');
    navigator.clipboard.writeText(txt).then(() => {setCopied(true);setTimeout(() => setCopied(false), 2000);});
  };

  return (
    <div className="page-pad-top" style={{ overflowY: 'auto', height: '100%' }}>
      {lightbox !== null && hasPhotos && <Lightbox photos={lbPhotos} startIndex={lightbox} onClose={() => setLightbox(null)} />}
      <div className="page-pad-x" style={{ padding: '48px 44px 32px' }}>
        <div onClick={() => setPage('photography')} style={{ fontFamily: sans, fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase', color: t.muted, cursor: 'pointer', marginBottom: 20 }}>← All photography</div>
        <div style={{ fontFamily: serif, fontSize: 32, marginBottom: 6 }}>{series.label}</div>
        <div style={{ fontFamily: sans, fontSize: 12, color: t.muted, marginBottom: 8 }}>{series.year}{hasPhotos ? ` · ${series.photos.length} images` : ''}</div>
        <div style={{ fontFamily: sans, fontSize: 13, color: t.muted, maxWidth: 480, lineHeight: 1.7 }}>{series.desc}</div>
      </div>

      {tweaks && hasPhotos ?
      <div style={{ padding: '0 44px 24px' }}>
          <div style={{ fontFamily: sans, fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase', color: t.muted, marginBottom: 16 }}>Drag to reorder · Tweaks mode</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
            {series.photos.map((src, i) =>
          <div key={src} draggable onDragStart={() => onDragStart(i)} onDragOver={(e) => e.preventDefault()} onDrop={() => onDrop(i)}
          style={{ position: 'relative', cursor: 'grab', border: `2px solid ${t.border}`, borderRadius: 3, overflow: 'hidden' }}
          onMouseEnter={(e) => e.currentTarget.style.boxShadow = '0 4px 16px rgba(0,0,0,0.18)'}
          onMouseLeave={(e) => e.currentTarget.style.boxShadow = 'none'}>
                <img src={src} style={{ width: '100%', height: 100, objectFit: 'cover', display: 'block', pointerEvents: 'none', userSelect: 'none' }} />
                <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, background: 'rgba(0,0,0,0.45)', padding: '4px 6px', fontFamily: sans, fontSize: 9, color: 'rgba(255,255,255,0.85)', letterSpacing: '0.04em' }}>
                  {i + 1} · {src.split('/').pop()}
                </div>
                <div style={{ position: 'absolute', top: 6, right: 6, color: 'rgba(255,255,255,0.7)', fontSize: 14, pointerEvents: 'none' }}>⠿</div>
              </div>
          )}
          </div>
          <div style={{ marginTop: 16, display: 'flex', alignItems: 'center', gap: 12 }}>
            <button onClick={copyOrder} style={{ fontFamily: sans, fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', background: 'none', border: `1px solid ${t.border}`, color: t.muted, padding: '6px 14px', borderRadius: 2, cursor: 'pointer' }}>
              {copied ? '✓ Copied' : 'Copy order'}
            </button>
            <span style={{ fontFamily: sans, fontSize: 10, color: t.muted }}>Paste into the code to make permanent</span>
          </div>
        </div> :

      <div className="page-pad-x photo-grid-3" style={{ padding: '0 44px 56px', display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, alignItems: 'start' }}>
          {hasPhotos ?
        splitIntoColumns(series.photos, 3).map((col, ci) =>
        <div key={ci} style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {col.map(({ item: src, idx }) =>
          <RealImg key={idx} src={src} onClick={() => setLightbox(idx)} style={{ cursor: 'pointer' }} />
          )}
                </div>
        ) :
        splitIntoColumns(placeholderHeights, 3).map((col, ci) =>
        <div key={ci} style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {col.map(({ item: h, idx }) =>
          <Photo key={idx} label={`${series.label} — ${String(idx + 1).padStart(2, '0')}`} t={t}
          style={{ width: '100%', height: h }} />
          )}
                </div>
        )
        }
        </div>
      }
    </div>);

}

                  <div style={{ fontFamily: sans, fontSize: 11, color: t.muted, marginBottom: 2 }}>{p.authors}</div>
                  <div style={{ fontFamily: sans, fontSize: 11, color: t.muted, fontStyle: 'italic' }}>{p.journal}</div>
                </div>
              </div>
            )}
          </>}
          <SectionLabel t={t} style={{ marginTop: 48, marginBottom: 20 }}>Presentations &amp; Posters</SectionLabel>
          {talks.map((talk, i) =>
          <div key={i} style={{ borderBottom: `1px solid ${t.border}`, padding: '16px 0', display: 'grid', gridTemplateColumns: '52px 1fr' }}>
              <div style={{ fontFamily: sans, fontSize: 11, color: t.muted, paddingTop: 3 }}>{talk.year}</div>
              <div>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 3 }}>
                  <div style={{ fontFamily: serif, fontSize: 15, lineHeight: 1.4 }}>
                    {talk.link
                      ? <a href={talk.link} target="_blank" rel="noreferrer" style={{ textDecoration: 'none', borderBottom: `1px solid ${t.border}` }}>{talk.title}</a>
                      : talk.title}
                  </div>
                  <span style={{ fontFamily: sans, fontSize: 9, letterSpacing: '0.08em', textTransform: 'uppercase', color: t.muted, border: `1px solid ${t.border}`, padding: '2px 6px', borderRadius: 2, whiteSpace: 'nowrap', flexShrink: 0 }}>{talk.type}</span>
                </div>
                <div style={{ fontFamily: sans, fontSize: 11, color: t.muted, marginBottom: talk.invited ? 3 : 0 }}>{talk.venue}</div>
                {talk.invited && <div style={{ fontFamily: serif, fontSize: 11, fontStyle: 'italic', color: t.muted }}>Invited talk</div>}
              </div>
            </div>
          )}
        </div>
        <div>
          <SectionLabel t={t} style={{ marginBottom: 20 }}>Tools</SectionLabel>
          {tools.map((tool, i) =>
          <div key={i} style={{ border: `1px solid ${t.border}`, padding: '16px 18px', marginBottom: 10 }}>
              <div style={{ fontFamily: sans, fontSize: 13, fontWeight: 500, marginBottom: 5 }}>{tool.name}</div>
              <div style={{ fontFamily: sans, fontSize: 12, color: t.muted, marginBottom: 12, lineHeight: 1.6 }}>{tool.desc}</div>
              <a href={tool.url} target="_blank" rel="noreferrer" style={{ fontFamily: sans, fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase', color: t.muted, borderBottom: `1px solid ${t.border}`, paddingBottom: 2, display: 'inline-block', textDecoration: 'none' }}>View →</a>
            </div>
          )}
          <SectionLabel t={t} style={{ marginTop: 36, marginBottom: 16 }}>Research Interests</SectionLabel>
          {interests.map((item) =>
          <div key={item} style={{ fontFamily: sans, fontSize: 12, color: t.muted, marginBottom: 9, paddingLeft: 12, borderLeft: `1px solid ${t.border}` }}>{item}</div>
          )}
        </div>
      </div>
    </div>);

}

/* ── App ──────────────────────────────────────────────────── */
function App() {
  const [dark, setDark] = useState(false);
  const [page, setPage] = useState('home');
  const [tweaks, setTweaks] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [seriesPhotos, setSeriesPhotos] = useState(() => {
    const map = {};
    seriesList.forEach((s) => {if (s.photos) map[s.id] = [...s.photos];});
    return map;
  });
  const t = dark ? DARK : LIGHT;

  useEffect(() => {
    document.documentElement.style.setProperty('--color-text', t.text);
    document.documentElement.style.setProperty('--color-muted', t.muted);
    document.documentElement.style.setProperty('--color-bg', t.bg);
    document.documentElement.style.setProperty('--color-sidebar', t.sidebar);
    document.documentElement.style.setProperty('--color-border', t.border);
  }, [dark]);

  useEffect(() => {
    const h = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaks(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);

  const updateSeriesOrder = (id, newPhotos) => setSeriesPhotos((prev) => ({ ...prev, [id]: newPhotos }));
  const resolvedSeries = seriesList.map((s) => seriesPhotos[s.id] ? { ...s, photos: seriesPhotos[s.id] } : s);

  const navigateTo = useCallback((p) => {setPage(p);setSidebarOpen(false);}, []);

  return (
    <div style={{ display: 'flex', height: '100vh', background: t.bg, transition: 'background 0.3s', position: 'relative' }}>
      {/* Mobile header (top-right name + subtitle) */}
      <div className="mobile-header">
        <div onClick={() => navigateTo('home')} style={{ fontFamily: serif, fontWeight: 400, lineHeight: 1.15, cursor: 'pointer', fontSize: 16, color: t.text, pointerEvents: 'auto' }}>
          Keaghan Yaxley
        </div>
        <div style={{ fontFamily: serif, fontStyle: 'italic', color: t.muted, lineHeight: 1.35, fontSize: 11, marginTop: 4 }}>
          Photographer · Evolutionary Biologist
        </div>
      </div>
      {/* Mobile hamburger */}
      <button className="hamburger" style={{ }} onClick={() => setSidebarOpen((o) => !o)}>
        <span style={{ transform: sidebarOpen ? 'rotate(45deg) translateY(6px)' : 'none' }}></span>
        <span style={{ opacity: sidebarOpen ? 0 : 1 }}></span>
        <span style={{ transform: sidebarOpen ? 'rotate(-45deg) translateY(-6px)' : 'none' }}></span>
      </button>
      {/* Mobile overlay */}
      {sidebarOpen && <div className="mobile-overlay" onClick={() => setSidebarOpen(false)} />}

      <Sidebar page={page} setPage={navigateTo} dark={dark} setDark={setDark} t={t} open={sidebarOpen} setOpen={setSidebarOpen} />

      <div className="main-content" style={{ flex: 1, overflow: 'hidden' }}>
        <PageFade pageKey={page}>
          {page === 'home' && <HomePage setPage={navigateTo} t={t} />}
          {page === 'photography' && <PhotographyPage setPage={navigateTo} t={t} resolvedSeries={resolvedSeries} />}
          {page === 'portfolio' && <PortfolioPage t={t} />}
          {page === 'research' && <ResearchPage t={t} />}
          {page === 'about' && <AboutPage t={t} />}
          {page.startsWith('series:') && <SeriesPage id={page.replace('series:', '')} setPage={navigateTo} t={t} tweaks={tweaks} resolvedSeries={resolvedSeries} updateSeriesOrder={updateSeriesOrder} />}
        </PageFade>
      </div>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
